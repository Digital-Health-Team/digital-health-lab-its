<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Glowing gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Build Plate -->
  <path d="M20 85 L64 65 L108 85 L64 105 Z" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  <path d="M20 85 L20 90 L64 110 L108 90 L108 85" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  <line x1="64" y1="105" x2="64" y2="110" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Extruded Layered Object -->
  <!-- Bottom layer -->
  <path d="M44 80 L64 71 L84 80 L64 89 Z" stroke="url(#cyanGlow)" stroke-width="1" opacity="0.4" />
  <!-- Middle layer -->
  <path d="M44 72 L64 63 L84 72 L64 81 Z" stroke="url(#cyanGlow)" stroke-width="1.5" opacity="0.7" />
  <!-- Top active layer (printing) -->
  <path d="M44 64 L64 55 L84 64 L64 73 Z" stroke="url(#cyanGlow)" stroke-width="2.5" filter="url(#glow)" />
  <polygon points="44,64 64,55 84,64 64,73" fill="rgba(0, 242, 254, 0.15)" />

  <!-- Extruder Nozzle -->
  <path d="M56 20 L72 20 L72 32 L68 38 L64 45 L60 38 L56 32 Z" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" />
  <circle cx="64" cy="45" r="1.5" fill="#ffffff" />

  <!-- Printing Filament Beam (Nozzle to object) -->
  <path d="M64 45 L64 55" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="64" cy="55" r="2.5" fill="#ffffff" filter="url(#glow)" />
</svg>
