; Upload ceilings for the publishing hub (/publish).
;
; upload_max_filesize and post_max_size are PHP_INI_PERDIR — the app cannot raise them
; with ini_set() at runtime, and PHP rejects an oversized POST in the SAPI before any
; Laravel code runs, so a `max:` validation rule can never produce a friendly error for
; a request this blocks. PublishController reads these values back via
; UploadedFile::getMaxFilesize() and caps its own limits and UI copy to match.
;
; Honoured by PHP-FPM / CGI SAPIs. It does NOT apply to `php artisan serve` (the CLI
; server reads only the main php.ini) or to Apache with mod_php (use php_value there).
; Nginx additionally needs: client_max_body_size 64M;

upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 20
