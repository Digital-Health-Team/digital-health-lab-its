<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Glowing gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8b5" />
      <stop offset="100%" stop-color="#006e80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Isometric Grid / Tech Lines in background -->
  <path d="M64 15 L108 40 L108 90 L64 115 L20 90 L20 40 Z" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  <path d="M64 15 L64 115" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="2 2" />
  <path d="M20 40 L108 90" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="2 2" />
  <path d="M20 90 L108 40" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Outer Isometric Cube / Wireframe Box -->
  <path d="M64 25 L100 45 L100 85 L64 105 L28 85 L28 45 Z" stroke="url(#primaryGlow)" stroke-width="2" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M64 25 L64 105" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-dasharray="4 2" />
  <path d="M28 45 L64 65 L100 45" stroke="url(#primaryGlow)" stroke-width="1.5" />

  <!-- 3D Printed Layered Core (Teal and Cyan layers) -->
  <!-- Layer 3 (Top) -->
  <path d="M64 48 L80 57 L64 66 L48 57 Z" fill="url(#primaryGlow)" opacity="0.9" />
  <!-- Layer 2 (Middle) -->
  <path d="M64 58 L80 67 L64 76 L48 67 Z" fill="url(#accentGlow)" opacity="0.7" />
  <!-- Layer 1 (Bottom) -->
  <path d="M64 68 L80 77 L64 86 L48 77 Z" fill="url(#primaryGlow)" opacity="0.5" />
  
  <!-- Scanner Beam Line sweeping across -->
  <line x1="15" y1="55" x2="113" y2="55" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" />
  <polygon points="15,55 64,25 113,55 64,85" fill="rgba(0, 242, 254, 0.08)" />

  <!-- Tiny Glowing Nodes -->
  <circle cx="64" cy="25" r="3" fill="#ffffff" filter="url(#glow)" />
  <circle cx="28" cy="45" r="3" fill="#00f2fe" />
  <circle cx="100" cy="45" r="3" fill="#00f2fe" />
  <circle cx="64" cy="65" r="3.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="28" cy="85" r="3" fill="#00f2fe" />
  <circle cx="100" cy="85" r="3" fill="#00f2fe" />
  <circle cx="64" cy="105" r="3" fill="#ffffff" filter="url(#glow)" />
</svg>
